name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  NODE_ENV: test
  JWT_SECRET: test-jwt-secret-key-for-ci
  AI_MOCK_MODE: "true"

jobs:
  build-and-test:
    name: Build & Test (Backend + Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Backend CI (Jest & Supertest)
        run: |
          if [ -f "backend/package.json" ]; then
            cd backend
            npm install --include=dev
            npm run seed 
            npm test 
          elif [ -f "server/package.json" ]; then
            cd server
            npm install --include=dev
            npm run seed 
            npm test 
          else
            echo "Backend package.json henüz eklenmemiş, bu adım atlanıyor."
          fi

      