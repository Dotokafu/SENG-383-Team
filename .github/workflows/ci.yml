name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  NODE_ENV: test
  JWT_SECRET: test-jwt-secret-key-for-ci
  AI_MOCK_MODE: "true"

jobs:
  build-and-test:
    name: Build & Test (Backend + Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend CI (Jest & Supertest)
        run: |
          if [ -f "backend/package.json" ]; then
            cd backend
            npm install
            npm run seed --if-present
            npm test --if-present -- --passWithNoTests
          elif [ -f "server/package.json" ]; then
            cd server
            npm install
            npm run seed --if-present
            npm test --if-present -- --passWithNoTests
          else
            echo "Backend package.json henüz eklenmemiş, bu adım atlanıyor."
          fi

      - name: Frontend CI (Vite & Vitest)
        run: |
          if [ -f "frontend/package.json" ]; then
            cd frontend
            npm install
            npm test --if-present -- --run --passWithNoTests
            npm run build --if-present
          elif [ -f "client/package.json" ]; then
            cd client
            npm install
            npm test --if-present -- --run --passWithNoTests
            npm run build --if-present
          else
            echo "Frontend package.json henüz eklenmemiş, bu adım atlanıyor."
          fi

      - name: Root Project Check (Eğer tek package.json varsa)
        run: |
          if [ -f "package.json" ]; then
            npm install
            npm test --if-present
            npm run build --if-present
          fi
